networks:
  proxy:
    external: false
    name: proxy


services:

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "80:80"

      - "18080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/logs:/logs
      - ./traefik/config/dynamic.yml:/etc/traefik/config/dynamic.yml:ro


    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.lab.internal`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.routers.dashboard.service=api@internal"



  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ./traefik-manager/config:/app/config
      - ./traefik-manager/backups:/app/backups
      - ./traefik/config/dynamic.yml:/app/config/dynamic.yml
    environment:
      - COOKIE_SECURE=false



    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-manager.rule=Host(`tm.lab.internal`)"
      - "traefik.http.routers.traefik-manager.entrypoints=web"
      - "traefik.http.services.traefik-manager.loadbalancer.server.port=5000"

    depends_on:
      - traefik


