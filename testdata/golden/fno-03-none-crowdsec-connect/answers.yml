mode: full-native
deployment: internal
dashboard: false
tls:
  method: none
native:
  install_dir: /opt/traefik-manager
  data_dir: /var/lib/traefik-manager
  port: "5100"
config:
  layout: single
mounts:
  static_config: false
crowdsec:
  mode: connect
  lapi_url: http://127.0.0.1:8080
  machine_id: traefik-manager
  alert_limit: "1200"
secrets:
  CROWDSEC_API_KEY: crowdsec-api-key-PLACEHOLDER
  CROWDSEC_MACHINE_PASSWORD: crowdsec-machine-password-PLACEHOLDER
network:
  traefik_api_port: "8081"
