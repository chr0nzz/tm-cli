networks:
  traefik-net:
    external: true
    name: traefik-net
  socket-proxy-net:
    internal: true

services:
  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    restart: unless-stopped
    networks:
      - traefik-net
      - socket-proxy-net
    volumes:
      - ./config:/app/config
      - ./backups:/app/backups
      - /opt/traefik/logs/access.log:/app/logs/access.log:ro
      - /opt/traefik/acme.json:/app/acme.json:ro
      - /opt/traefik/traefik.yml:/app/traefik.yml
      - ./config:/app/config/dynamic
    environment:
      - COOKIE_SECURE=true
      - CONFIG_DIR=/app/config/dynamic
      - STATIC_CONFIG_PATH=/app/traefik.yml
      - RESTART_METHOD=proxy
      - TRAEFIK_CONTAINER=traefik
      - DOCKER_HOST=tcp://socket-proxy:2375
      - CROWDSEC_LAPI_URL=http://10.0.0.5:8080
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-manager.rule=Host(`tm.example.com`)"
      - "traefik.http.routers.traefik-manager.entrypoints=websecure"
      - "traefik.http.services.traefik-manager.loadbalancer.server.port=5000"
      - "traefik.http.routers.traefik-manager.tls.certresolver=letsencrypt"

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: unless-stopped
    networks:
      - socket-proxy-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      POST: 1
