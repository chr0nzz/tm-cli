mode: full
dir: /srv/traefik-stack
deployment: internal
domain: home.example
dashboard: true
tls:
  method: dns
  provider: other
  lego_provider: hetzner
  email: admin@home.example
  vars:
    HETZNER_TTL: "60"
    HETZNER_PROPAGATION_TIMEOUT: "120"
  secret_vars:
    - HETZNER_API_KEY
config:
  layout: directory
mounts:
  access_logs: true
  certs: true
  static_config: false
restart:
  method: none
crowdsec:
  mode: none
network:
  name: traefik-net
  traefik_api_port: "8080"
secrets:
  HETZNER_API_KEY: hetzner-api-key-PLACEHOLDER
