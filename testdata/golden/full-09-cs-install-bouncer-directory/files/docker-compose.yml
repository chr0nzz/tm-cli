networks:
  traefik-net:
    external: false
    name: traefik-net

volumes:
  crowdsec_data:

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    networks:
      - traefik-net
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/logs:/logs
      - ./traefik/config:/etc/traefik/config:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.example.com`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"

  traefik-manager:
    image: ghcr.io/chr0nzz/traefik-manager:latest
    container_name: traefik-manager
    restart: unless-stopped
    networks:
      - traefik-net
    volumes:
      - ./traefik-manager/config:/app/config
      - ./traefik-manager/backups:/app/backups
      - ./traefik/logs:/app/logs:ro
      - ./traefik/acme.json:/app/acme.json:ro
      - ./traefik/config:/app/config/dynamic
    environment:
      - COOKIE_SECURE=true
      - CONFIG_DIR=/app/config/dynamic
      - CROWDSEC_LAPI_URL=http://crowdsec:8080
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
      - CROWDSEC_MACHINE_ID=traefik-manager
      - CROWDSEC_MACHINE_PASSWORD=${CROWDSEC_MACHINE_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-manager.rule=Host(`manager.example.com`)"
      - "traefik.http.routers.traefik-manager.entrypoints=websecure"
      - "traefik.http.services.traefik-manager.loadbalancer.server.port=5000"
      - "traefik.http.routers.traefik-manager.tls.certresolver=letsencrypt"
    depends_on:
      - traefik

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    networks:
      - traefik-net
    environment:
      - BOUNCER_KEY_traefikmanager=${CROWDSEC_API_KEY}
      - COLLECTIONS=crowdsecurity/traefik
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./traefik/logs/access.log:/var/log/traefik/access.log:ro
