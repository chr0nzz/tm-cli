mode: agent-binary
tls:
  method: none
agent:
  traefik_url: http://localhost:8080
  config_path: /etc/traefik/conf.d
  port: "8090"
mounts:
  access_logs: false
  certs: true
  acme_path: /etc/traefik/acme.json
  certs_writable: true
  static_config: false
  plugins: false
restart:
  method: proxy
  container: traefik
  docker_host: tcp://127.0.0.1:2375
crowdsec:
  mode: none
secrets:
  TMA_API_KEY: tma-api-key-PLACEHOLDER
