mode: agent-docker
dir: /opt/traefik-manager-agent
tls:
  method: none
agent:
  traefik_url: http://traefik:8080
  config_path: /app/config
  port: "8090"
mounts:
  access_logs: false
  certs: false
  static_config: false
  plugins: false
restart:
  method: none
crowdsec:
  mode: none
secrets:
  TMA_API_KEY: tma-api-key-PLACEHOLDER
