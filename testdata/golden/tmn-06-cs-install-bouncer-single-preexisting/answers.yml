mode: tm-native
tls:
  method: none
native:
  install_dir: /opt/traefik-manager
  data_dir: /var/lib/traefik-manager
  port: "5000"
  service_user: true
config:
  layout: single
  path: /etc/traefik/dynamic.yml
mounts:
  access_logs: true
  access_log_path: /var/log/traefik/access.log
  certs: false
  static_config: true
  static_config_path: /etc/traefik/traefik.yml
restart:
  method: poison-pill
  traefik_systemd: true
  traefik_service: traefik
  signal_file: /var/lib/traefik-manager/signals/restart.sig
crowdsec:
  mode: install
  bouncer_plugin: true
secrets:
  CROWDSEC_API_KEY: crowdsec-api-key-PLACEHOLDER
  CROWDSEC_MACHINE_PASSWORD: crowdsec-machine-password-PLACEHOLDER
