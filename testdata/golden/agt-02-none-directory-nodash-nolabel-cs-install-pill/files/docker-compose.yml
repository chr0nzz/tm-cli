networks:
  traefik-net:
    external: false
    name: traefik-net

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    networks:
      - traefik-net
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/logs:/logs
      - ./traefik/config:/etc/traefik/config:ro
      - traefik-signals:/signals
    healthcheck:
      test: ["CMD-SHELL", "[ ! -f /signals/restart.sig ] || (rm /signals/restart.sig && kill -TERM 1)"]
      interval: 5s
      timeout: 3s
      retries: 1

  traefik-manager-agent:
    image: ghcr.io/chr0nzz/traefik-manager-agent:latest
    container_name: traefik-manager-agent
    restart: unless-stopped
    networks:
      - traefik-net
    ports:
      - "8090:8090"
    environment:
      - TMA_API_KEY=${TMA_API_KEY}
      - TRAEFIK_API_URL=http://traefik:8080
      - TMA_RATE_LIMIT=300
      - CONFIG_PATH=/etc/traefik/config
      - RESTART_METHOD=poison-pill
      - TRAEFIK_CONTAINER=traefik
      - SIGNAL_FILE_PATH=/signals/restart.sig
      - ACCESS_LOG_PATH=/var/log/traefik/access.log
      - CROWDSEC_LAPI_URL=http://crowdsec:8080
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
    volumes:
      - ./traefik/config:/etc/traefik/config
      - ./backups:/app/backups
      - ./traefik/logs/access.log:/var/log/traefik/access.log:ro
      - traefik-signals:/signals
    depends_on:
      - traefik

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    networks:
      - traefik-net
    environment:
      - BOUNCER_KEY_tma=${CROWDSEC_API_KEY}
      - COLLECTIONS=crowdsecurity/traefik
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./traefik/logs/access.log:/var/log/traefik/access.log:ro

volumes:
  traefik-signals:
  crowdsec_data:
