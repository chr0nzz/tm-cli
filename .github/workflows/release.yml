name: Release tm Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the tm binaries to
        required: true

permissions:
  contents: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build tm binaries
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          commit="$(git rev-parse --short HEAD)"
          date="$(git show -s --format=%cs HEAD)"
          ldflags="-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64       go build -trimpath -ldflags "$ldflags" -o dist/tm-linux-amd64 ./cmd/tm
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64       go build -trimpath -ldflags "$ldflags" -o dist/tm-linux-arm64 ./cmd/tm
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags "$ldflags" -o dist/tm-linux-armv7 ./cmd/tm
          (cd dist && sha256sum tm-linux-* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: |
            dist/tm-linux-amd64
            dist/tm-linux-arm64
            dist/tm-linux-armv7
            dist/SHA256SUMS
          fail_on_unmatched_files: true
