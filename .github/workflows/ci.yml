name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Bootstrap smoke test
        run: |
          sh -n setup.sh
          TM_BOOTSTRAP_TEST=1 sh setup.sh
          TM_BOOTSTRAP_TEST=1 TM_VERSION=1.0.0 sh setup.sh | grep -q '/releases/download/v1.0.0/tm-linux-amd64$'

  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: shellcheck
        run: |
          shellcheck -s sh setup.sh
          for f in scripts/*.sh; do
            if [ -e "$f" ]; then
              shellcheck "$f"
            fi
          done
